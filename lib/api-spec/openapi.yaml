openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-number login
  - name: orders
    description: Pickup orders
  - name: menu
    description: Live menu state
  - name: catering
    description: Catering quote requests
  - name: delivery
    description: In-house delivery quotes
  - name: admin
    description: Staff order board
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/request-code:
    post:
      operationId: requestCode
      tags: [auth]
      summary: Send a login code to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeInput"
      responses:
        "200":
          description: Code sent (or would be, once SMS is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-code:
    post:
      operationId: verifyCode
      tags: [auth]
      summary: Verify a login code and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current logged-in user, if any
      responses:
        "200":
          description: Current user (null if not logged in)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a pickup order (requires login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Empty or invalid cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}/pay:
    post:
      operationId: payOrder
      tags: [orders]
      summary: Pay for a pending delivery order (requires login)
      description: >-
        Charges the order total (items + delivery fee) through the payment
        boundary and marks it paid. Idempotent — paying an already-paid order
        returns it unchanged and never double-charges.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order (paid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/mine:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List the current user's orders (requires login)
      responses:
        "200":
          description: Orders, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /menu/state:
    get:
      operationId: getMenuState
      tags: [menu]
      summary: Live menu state — sold-out items, price overrides, ordering pause
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuState"
  /delivery/quote:
    post:
      operationId: quoteDelivery
      tags: [delivery]
      summary: Check delivery eligibility and fee for an address (no login required)
      description: >-
        The client sends only an address. The server geocodes it, and returns
        eligibility, distance, and fee — the browser never supplies coordinates,
        distance, or fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryQuoteInput"
      responses:
        "200":
          description: Quote (eligible may be false when outside the delivery radius)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryQuote"
        "400":
          description: Missing or invalid address fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Address could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /delivery/slots:
    get:
      operationId: getDeliverySlots
      tags: [delivery]
      summary: Available scheduled delivery windows (no login required)
      description: >-
        Upcoming delivery windows with remaining capacity, derived from store
        hours minus the lead time, with already-booked windows removed. Empty
        when online ordering is paused.
      responses:
        "200":
          description: Available windows, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliverySlot"
  /catering/requests:
    post:
      operationId: createCateringRequest
      tags: [catering]
      summary: Submit a catering quote request (no login required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCateringRequestInput"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CateringRequest"
        "400":
          description: Invalid or empty request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/catering:
    get:
      operationId: getAdminCateringRequests
      tags: [admin]
      summary: List catering requests (requires staff login)
      responses:
        "200":
          description: Requests, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CateringRequest"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/catering/{id}/status:
    post:
      operationId: updateCateringStatus
      tags: [admin]
      summary: Update a catering request's status (requires staff login)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCateringStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CateringRequest"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Staff login to the order board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the staff session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [admin]
      summary: List all orders (requires staff login)
      responses:
        "200":
          description: Orders, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders/{id}/status:
    post:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update an order's status (requires staff login)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/menu/overrides/{itemId}:
    put:
      operationId: updateMenuOverride
      tags: [admin]
      summary: Set an item's sold-out flag and price override (requires staff login)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuOverrideInput"
      responses:
        "200":
          description: Updated override state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuOverride"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/store:
    post:
      operationId: updateStoreState
      tags: [admin]
      summary: Pause or resume online ordering (requires staff login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreStateInput"
      responses:
        "200":
          description: Updated store state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreState"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/drivers:
    get:
      operationId: getAdminDrivers
      tags: [admin]
      summary: List delivery drivers (requires staff login)
      responses:
        "200":
          description: Drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDriver
      tags: [admin]
      summary: Add a delivery driver (requires staff login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverInput"
      responses:
        "201":
          description: Driver created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "400":
          description: Invalid driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders/{id}/delivery:
    post:
      operationId: updateOrderDelivery
      tags: [admin]
      summary: Assign a driver and set delivery status (requires staff login)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Not a delivery order or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in as staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order or driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RequestCodeInput:
      type: object
      properties:
        phone:
          type: string
          description: E.164 format, e.g. +14692943500
      required:
        - phone
    VerifyCodeInput:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
      required:
        - phone
        - code
    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: string
          nullable: true
      required:
        - id
        - phone
    UserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required:
        - user
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: string
        name:
          type: string
        unitPriceCents:
          type: integer
        qty:
          type: integer
      required:
        - id
        - itemId
        - name
        - unitPriceCents
        - qty
    OrderItemInput:
      description: >-
        Only itemId + qty — name and price are looked up server-side from the
        menu catalog, never trusted from the client.
      type: object
      properties:
        itemId:
          type: string
        qty:
          type: integer
          minimum: 1
      required:
        - itemId
        - qty
    OrderStatus:
      type: string
      enum: [new, preparing, ready, picked_up]
    FulfillmentType:
      type: string
      enum: [pickup, delivery]
    PaymentStatus:
      type: string
      enum: [pending, paid, failed]
    DeliveryStatus:
      type: string
      enum: [unassigned, assigned, out_for_delivery, delivered]
    OrderDelivery:
      description: Delivery details attached to a delivery order.
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        distanceMeters:
          type: integer
        deliveryFeeCents:
          type: integer
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
        driverId:
          type: integer
          nullable: true
        driverName:
          type: string
          nullable: true
      required:
        - line1
        - city
        - state
        - zip
        - distanceMeters
        - deliveryFeeCents
        - deliveryStatus
        - driverId
        - driverName
    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/OrderStatus"
        fulfillmentType:
          $ref: "#/components/schemas/FulfillmentType"
        pickupName:
          type: string
        note:
          type: string
          nullable: true
        subtotalCents:
          type: integer
        pickupEta:
          type: string
          format: date-time
          nullable: true
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        delivery:
          oneOf:
            - $ref: "#/components/schemas/OrderDelivery"
            - type: "null"
      required:
        - id
        - status
        - fulfillmentType
        - pickupName
        - subtotalCents
        - paymentStatus
        - createdAt
        - items
        - delivery
    CreateOrderInput:
      description: >-
        fulfillmentType defaults to pickup. For delivery, address and
        scheduledFor are required and re-validated server-side (eligibility,
        minimum order, slot availability) — the browser's fee/distance are never
        trusted.
      type: object
      properties:
        fulfillmentType:
          $ref: "#/components/schemas/FulfillmentType"
        pickupName:
          type: string
          minLength: 1
        note:
          type: string
        address:
          $ref: "#/components/schemas/DeliveryQuoteInput"
        scheduledFor:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required:
        - pickupName
        - items
    MenuOverride:
      description: >-
        Staff-set deviation from the printed menu for one item. priceCents null
        means the catalog price applies.
      type: object
      properties:
        itemId:
          type: string
        soldOut:
          type: boolean
        priceCents:
          type: integer
          nullable: true
      required:
        - itemId
        - soldOut
        - priceCents
    MenuState:
      type: object
      properties:
        orderingPaused:
          type: boolean
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/MenuOverride"
      required:
        - orderingPaused
        - overrides
    UpdateMenuOverrideInput:
      description: >-
        Full desired state for one item — soldOut false plus priceCents null
        returns the item to its printed-menu defaults.
      type: object
      properties:
        soldOut:
          type: boolean
        priceCents:
          type: integer
          minimum: 1
          nullable: true
      required:
        - soldOut
        - priceCents
    StoreState:
      type: object
      properties:
        orderingPaused:
          type: boolean
      required:
        - orderingPaused
    UpdateStoreStateInput:
      type: object
      properties:
        orderingPaused:
          type: boolean
      required:
        - orderingPaused
    DeliveryQuoteInput:
      description: A US delivery address to check against the delivery radius.
      type: object
      properties:
        line1:
          type: string
          minLength: 1
        line2:
          type: string
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 2
        zip:
          type: string
          minLength: 5
      required:
        - line1
        - city
        - state
        - zip
    DeliveryQuote:
      description: >-
        Server-authoritative delivery quote. distanceMeters and deliveryFeeCents
        are computed on the server; eligible is false when the address is
        outside the delivery radius.
      type: object
      properties:
        eligible:
          type: boolean
        distanceMeters:
          type: integer
        deliveryFeeCents:
          type: integer
        minimumOrderCents:
          type: integer
      required:
        - eligible
        - distanceMeters
        - deliveryFeeCents
        - minimumOrderCents
    DeliverySlot:
      description: A bookable delivery window with its remaining capacity.
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        remaining:
          type: integer
      required:
        - startsAt
        - endsAt
        - remaining
    TraySize:
      type: string
      enum: [half, full]
    CateringStatus:
      type: string
      enum: [new, contacted, quoted, closed]
    CateringItem:
      type: object
      properties:
        id:
          type: integer
        trayId:
          type: string
        name:
          type: string
        size:
          $ref: "#/components/schemas/TraySize"
        qty:
          type: integer
        unitPriceCents:
          type: integer
      required:
        - id
        - trayId
        - name
        - size
        - qty
        - unitPriceCents
    CateringItemInput:
      description: >-
        Only trayId + size + qty — the name and price are looked up server-side
        from the catering tray catalog, never trusted from the client.
      type: object
      properties:
        trayId:
          type: string
        size:
          $ref: "#/components/schemas/TraySize"
        qty:
          type: integer
          minimum: 1
      required:
        - trayId
        - size
        - qty
    CateringRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/CateringStatus"
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        eventDate:
          type: string
        eventType:
          type: string
        guestCount:
          type: integer
        note:
          type: string
          nullable: true
        estimateCents:
          type: integer
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/CateringItem"
      required:
        - id
        - status
        - name
        - phone
        - email
        - eventDate
        - eventType
        - guestCount
        - estimateCents
        - createdAt
        - items
    CreateCateringRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          # A pattern rather than `format: email` on purpose: orval maps the
          # format to zod.email(), which only exists in zod v4, and this
          # workspace is on zod 3.x — the generated file would not compile.
          # .regex() exists in both, so this survives regeneration.
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        eventDate:
          type: string
          minLength: 1
        eventType:
          type: string
          minLength: 1
        guestCount:
          type: integer
          minimum: 1
        note:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CateringItemInput"
      required:
        - name
        - phone
        - email
        - eventDate
        - eventType
        - guestCount
        - items
    UpdateCateringStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CateringStatus"
      required:
        - status
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    UpdateOrderStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      required:
        - status
    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - phone
        - active
    CreateDriverInput:
      type: object
