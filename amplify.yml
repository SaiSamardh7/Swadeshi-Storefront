version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        # vite.config.ts requires PORT and BASE_PATH (Replit injects them; Amplify doesn't)
        - PORT=8080 BASE_PATH=/ pnpm --filter @workspace/swadeshi typecheck
        - PORT=8080 BASE_PATH=/ pnpm --filter @workspace/swadeshi build
  artifacts:
    baseDirectory: artifacts/swadeshi/dist/public
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
