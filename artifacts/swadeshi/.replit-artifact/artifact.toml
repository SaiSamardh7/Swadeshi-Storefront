kind = "web"
previewPath = "/"
title = "Swadeshi"
version = "1.0.0"
id = "artifacts/swadeshi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19537

[services.development]
run = "pnpm --filter @workspace/swadeshi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swadeshi", "run", "build" ]
publicDir = "artifacts/swadeshi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19537"
BASE_PATH = "/"
